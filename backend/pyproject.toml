[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Generic[T] понятнее, чем синтаксис class Repo[T]
ignore = ["UP046", "UP047"]

[tool.ruff.lint.isort]
# папка alembic/ — это наши миграции, а пакет alembic — сторонний
known-third-party = ["alembic"]
known-first-party = ["app"]

[tool.mypy]
ignore_missing_imports = true
# папка alembic/ мешает mypy найти пакет alembic; env.py проверяет сам Alembic при запуске
exclude = ["^alembic/"]
# Settings() без аргументов: значения берутся из окружения.
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# app импортируется из папки backend, как при запуске uvicorn
pythonpath = ["."]